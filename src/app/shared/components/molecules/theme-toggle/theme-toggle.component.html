<div class="c-theme-toggle">
  <button
    type="button"
    class="c-theme-toggle__btn btn btn-outline-secondary btn-sm"
    (click)="toggle()"
    [attr.aria-label]="theme.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
    <span class="c-theme-toggle__icon">
      @if (theme.isDark()) {
        <!-- Sol en blanco -->
        <svg viewBox="0 0 24 24" width="22" height="22" fill="#ffffff" aria-hidden="true">
          <path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm0 17a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1zM4.22 4.22a1 1 0 0 1 1.42 0l1.4 1.4A1 1 0 1 1 5.63 7.04l-1.4-1.4a1 1 0 0 1 0-1.42zm12.72 12.72a1 1 0 0 1 1.42 0l1.4 1.4a1 1 0 0 1-1.41 1.42l-1.41-1.4a1 1 0 0 1 0-1.42zM2 12a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2H3a1 1 0 0 1-1-1zm17 0a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2h-2a1 1 0 0 1-1-1zM4.22 19.78a1 1 0 0 1 0-1.42l1.4-1.4a1 1 0 1 1 1.42 1.41l-1.4 1.41a1 1 0 0 1-1.42 0zM16.94 7.06a1 1 0 0 1 0-1.42l1.4-1.4a1 1 0 1 1 1.42 1.41l-1.4 1.41a1 1 0 0 1-1.42 0z" />
        </svg>
      } @else {
        <!-- Luna en blanco -->
        <svg viewBox="0 0 24 24" width="22" height="22" fill="#ffffff" aria-hidden="true">
          <path d="M21.64 13a1 1 0 0 0-1.05-.14 8 8 0 0 1-3.37.73 8 8 0 0 1-8-8 8 8 0 0 1 .73-3.37A1 1 0 0 0 8.36 1 10 10 0 1 0 22 14.66a1 1 0 0 0-.36-1.66z" />
        </svg>
      }
    </span>
  </button>
</div>
