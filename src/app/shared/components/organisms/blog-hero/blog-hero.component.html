<section class="c-blog-hero position-relative">
  <div class="c-blog-hero__media-container">
    <!-- Video 1: blog-animado.mp4 -->
    <video
      #video1
      [src]="videoList[0]"
      autoplay
      muted
      [muted]="true"
      playsinline
      preload="auto"
      class="c-blog-hero__video"
      [class.c-blog-hero__video--active]="activeVideoIndex === 0"
      (ended)="onVideoEnded(0)">
    </video>

    <!-- Video 2: blog-animado4.mp4 -->
    <video
      #video2
      [src]="videoList[1]"
      muted
      [muted]="true"
      playsinline
      preload="auto"
      class="c-blog-hero__video"
      [class.c-blog-hero__video--active]="activeVideoIndex === 1"
      (ended)="onVideoEnded(1)">
    </video>
  </div>
</section>
