<section id="conditions" class="c-conditions-section py-3 py-md-5" data-aos="fade-right">
  <div class="container py-5">

    <app-section-title
      title="¿Puedo Ayudarte?"
      subtitle="Si estás viviendo alguna de estas condiciones o síntomas, estoy aquí para acompañarte con un enfoque integral que une la Medicina Familiar con su visión preventiva en todas las etapas de la vida y la Medicina Funcional, orientada a descubrir las causas profundas de tus problemas de salud.">
    </app-section-title>

    <div class="c-conditions-section__grid row g-4 justify-content-center">
      <div
        class="col-md-6 col-lg-4"
        *ngFor="let condition of conditions; let i = index">
        <app-condition-card
          [condition]="condition"
          [extraMarginTitle]="i >= conditions.length - 3">
        </app-condition-card>
      </div>
    </div>

  </div>
</section>
